# Evidence-only workflow for upstream PR #810 (Codename-11/hermes-relay).
# Runs on a branch whose only delta over the PR head 60286807 is this file:
# the app and test code under test are byte-identical to the PR head.
# It exists because the PR's new unit test class is not in the fixed CI
# focused-test list, and the emulator lane is on-demand only.
name: Verify 810 evidence

on:
  workflow_dispatch:
  push:
    branches: [verify-810-evidence]

permissions:
  contents: read

jobs:
  history-retry-unit:
    name: HistoryLoadRetryTest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run HistoryLoadRetryTest on sideloadDebug
        run: |
          ./gradlew :app:testSideloadDebugUnitTest \
            --tests "com.hermesandroid.relay.viewmodel.HistoryLoadRetryTest" \
            --console=plain

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-retry-unit-results
          path: |
            app/build/test-results/testSideloadDebugUnitTest/TEST-com.hermesandroid.relay.viewmodel.HistoryLoadRetryTest.xml
            app/build/reports/tests/testSideloadDebugUnitTest/
          if-no-files-found: warn

  history-recovery-emulator:
    name: DashboardHistoryRecovery on standardPhoneApi36 (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run DashboardHistoryRecoveryInstrumentedTest on Standard Phone API 36 lane
        run: |
          ./gradlew :app:standardPhoneApi36SideloadDebugAndroidTest \
            '-Pandroid.testInstrumentationRunnerArguments.class=com.hermesandroid.relay.viewmodel.DashboardHistoryRecoveryInstrumentedTest' \
            --console=plain

      - name: Upload managed-device test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-recovery-emulator-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: warn
