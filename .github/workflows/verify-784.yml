# Evidence-only workflow for upstream PR #784 (Codename-11/hermes-relay).
# Runs on a branch whose only delta over the PR head 4ee36758 is this file:
# the app and test code under test are byte-identical to the PR head.
# It exists because one of the PR's test classes (ChatInputPreferencesTest)
# is not in the fixed CI focused-test list, and the intake review asked for
# screenshot evidence for the new setting; the Roborazzi screenshot test
# runs as a unit test and its captured images are uploaded here.
name: Verify 784 evidence

on:
  workflow_dispatch:
  push:
    branches: [verify-784-evidence]

permissions:
  contents: read

jobs:
  unread-tests-unit:
    name: Unread feature tests (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Run the PR's four test classes on sideloadDebug
        run: |
          ./gradlew :app:testSideloadDebugUnitTest \
            --tests "com.hermesandroid.relay.data.ChatUnreadStoreTest" \
            --tests "com.hermesandroid.relay.data.ChatInputPreferencesTest" \
            --tests "com.hermesandroid.relay.ui.components.ProfileShelfPolicyTest" \
            --tests "com.hermesandroid.relay.screenshots.UnreadConversationsScreenshotTest" \
            --console=plain

      - name: Upload unit test results and Roborazzi screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unread-feature-test-results
          path: |
            app/build/test-results/testSideloadDebugUnitTest/TEST-com.hermesandroid.relay.data.ChatUnreadStoreTest.xml
            app/build/test-results/testSideloadDebugUnitTest/TEST-com.hermesandroid.relay.data.ChatInputPreferencesTest.xml
            app/build/test-results/testSideloadDebugUnitTest/TEST-com.hermesandroid.relay.ui.components.ProfileShelfPolicyTest.xml
            app/build/test-results/testSideloadDebugUnitTest/TEST-com.hermesandroid.relay.screenshots.UnreadConversationsScreenshotTest.xml
            app/build/outputs/roborazzi/
            app/build/reports/tests/testSideloadDebugUnitTest/
          if-no-files-found: warn
